# Independent TEST stack. Never mount notesgym-data or a production directory here.
services:
  notesgym-chatgpt:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env.mcp.local
    environment:
      NODE_ENV: ${NOTESGYM_RUNTIME_MODE:-development}
      NOTESGYM_DATA_DIR: /data
      NOTESGYM_OAUTH_DB: /data/oauth/oauth.sqlite
    volumes:
      - notesgym-mcp-test-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    restart: "no"
    stop_grace_period: 20s

volumes:
  notesgym-mcp-test-data:
