# Independent TEST stack. Never mount notesgym-data or a production directory here.
services:
  notesgym-chatgpt:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env.mcp.local
    environment:
      NODE_ENV: development
      NOTESGYM_DATA_DIR: /data
    volumes:
      - notesgym-mcp-test-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    restart: "no"

volumes:
  notesgym-mcp-test-data:
